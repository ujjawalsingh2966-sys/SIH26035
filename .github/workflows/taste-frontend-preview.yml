name: W8LAB Taste frontend validation

on:
  pull_request:
    paths:
      - frontend/**
      - landing/**
      - backend/**
      - package.json
      - package-lock.json
      - .github/workflows/taste-frontend-preview.yml

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Frontend production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: https://w8lab-api.onrender.com
        run: npm run build --workspace frontend
      - name: Backend regression suite
        run: npm test --workspace backend -- --runInBand --coverage=false

  landing-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone landing dependencies
        run: npm install --prefix landing --no-audit --no-fund
      - name: Landing TypeScript check and production build
        run: npm run build --prefix landing
